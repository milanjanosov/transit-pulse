<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Transit Pulse</title>
<meta name="description" content="Every scheduled bus, tram, metro and train, moving through a whole day. Pick a city, scrub the clock and watch it breathe.">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0d0d;
    --ink: #f2f2f2;
    --ink-dim: #9a9a9a;
    --panel: rgba(13, 13, 13, 0.78);
    --line: rgba(255, 255, 255, 0.12);
    --accent: #FFD800;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: "Helvetica Neue", Helvetica, Inter, Arial, sans-serif; overflow: hidden; }
  #map { position: absolute; inset: 0; }
  #fx { position: absolute; inset: 0; pointer-events: none; }
  .maplibregl-ctrl-attrib { background: rgba(0,0,0,0.5) !important; }
  .maplibregl-ctrl-attrib, .maplibregl-ctrl-attrib a { color: #777 !important; font-size: 10px; }

  /* title + clock, the reel's typography */
  #head { position: absolute; top: max(16px, env(safe-area-inset-top)); left: 16px; right: 16px;
    pointer-events: none; text-shadow: 0 1px 12px rgba(0,0,0,0.9); }
  #head h1 { margin: 0; font-size: clamp(28px, 4.2vw, 48px); font-weight: 700; letter-spacing: -0.01em; }
  #head .sub { margin-top: 4px; font-size: clamp(14px, 1.6vw, 18px); color: var(--ink-dim); }
  #clock { margin-top: 10px; font-size: clamp(30px, 4vw, 44px); font-weight: 500;
    font-variant-numeric: tabular-nums; }
  #count { font-size: 14px; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
  #back { pointer-events: auto; margin-top: 12px; font-size: 13px; }
  #search { position: relative; pointer-events: auto; margin-top: 12px; width: min(280px, 100%); text-shadow: none; }
  #q { width: 100%; font: inherit; font-size: 15px; color: var(--ink); background: var(--panel);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; }
  #q:focus { outline: none; border-color: var(--accent); }
  #hits { position: absolute; left: 0; right: 0; top: calc(100% + 4px); background: #151515;
    border: 1px solid var(--line); border-radius: 10px; overflow: hidden; z-index: 4; max-height: 50vh; overflow-y: auto; }
  #hits div { padding: 8px 12px; font-size: 14px; cursor: pointer; display: flex; justify-content: space-between; gap: 10px; }
  #hits div span { color: var(--ink-dim); font-size: 12px; }
  #hits div:hover, #hits div.sel { background: rgba(255,255,255,0.08); }
  body.far .city .lbl { display: none; }
  body.far .city:hover .lbl { display: inline; }

  /* controls */
  #ctl { position: absolute; left: 16px; right: 16px; bottom: max(16px, env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
  .bar { pointer-events: auto; background: var(--panel); backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px); border: 1px solid var(--line); border-radius: 14px;
    padding: 10px 12px; display: flex; align-items: center; gap: 12px; max-width: 760px; width: 100%; }
  button { font: inherit; color: var(--ink); background: transparent; border: 1px solid var(--line);
    border-radius: 9px; padding: 7px 11px; cursor: pointer; }
  button:hover { border-color: rgba(255,255,255,0.35); }
  button.on { background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.4); }
  #play { width: 44px; height: 38px; padding: 0; font-size: 16px; flex: none; }
  #slider { flex: 1; min-width: 0; accent-color: var(--accent); height: 28px; }
  .speeds { display: flex; gap: 4px; flex: none; }
  .speeds button { padding: 6px 8px; font-size: 12px; }

  /* signup */
  #signup { flex-wrap: wrap; }
  #signup .pitch { flex: 1 1 240px; font-size: 14px; line-height: 1.35; }
  #signup .pitch b { display: block; font-size: 15px; }
  #signup .go { background: var(--accent); color: #111; border: 1px solid var(--accent); border-radius: 9px;
    padding: 8px 14px; font-weight: 700; text-decoration: none; white-space: nowrap; }
  #signup .x { border: none; color: var(--ink-dim); padding: 4px 6px; margin-left: auto; }

  /* legend */
  #legend { position: absolute; right: 16px; top: max(16px, env(safe-area-inset-top));
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px;
    font-size: 13px; line-height: 1.7; }
  #legend .row { display: flex; align-items: center; gap: 8px; }
  #legend .dots { display: flex; gap: 3px; }
  #legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block;
    box-shadow: 0 0 6px currentColor; }
  #legend .title { color: var(--ink-dim); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; }

  /* city markers on the landing map */
  .city { display: flex; align-items: center; gap: 7px; cursor: pointer; transform: translateX(7px); }
  .city .pin { width: 12px; height: 12px; border-radius: 50%; background: var(--accent);
    box-shadow: 0 0 0 4px rgba(255, 216, 0, 0.18), 0 0 16px rgba(255, 216, 0, 0.7); flex: none; }
  .city .lbl { font-size: 13px; font-weight: 500; color: var(--ink); white-space: nowrap;
    text-shadow: 0 1px 6px #000, 0 0 2px #000; }
  .city:hover .pin { background: #fff; }
  .city:hover .lbl { color: #fff; }
  #loading { position: absolute; inset: 0; display: grid; place-items: center; font-size: 15px;
    color: var(--ink-dim); background: rgba(13,13,13,0.6); z-index: 5; pointer-events: none; }

  .hidden { display: none !important; }
  @media (max-width: 640px) {
    #legend { top: auto; bottom: 168px; font-size: 12px; padding: 8px 10px; }
    .speeds button { padding: 5px 6px; }
    #signup .pitch { font-size: 13px; }
    .city .lbl { font-size: 12px; }
  }
  body.embed #signup { display: none; }
</style>
</head>
<body>
<div id="map"></div>
<canvas id="fx"></canvas>

<div id="head">
  <h1 id="city">Transit Pulse</h1>
  <div class="sub" id="subtitle">Every scheduled vehicle, through a whole day. Pick a city on the map.</div>
  <div id="clock" class="hidden">08:00</div>
  <div id="count"></div>
  <div id="search"><input id="q" type="search" placeholder="Search a city…" autocomplete="off" aria-label="Search a city"><div id="hits" class="hidden"></div></div>
  <button id="back" class="hidden">← All cities</button>
</div>

<div id="legend" class="hidden"></div>

<div id="ctl">
  <div class="bar hidden" id="player">
    <button id="play" aria-label="Play or pause">❚❚</button>
    <input id="slider" type="range" min="0" max="1" step="1" aria-label="Time of day">
    <div class="speeds" id="speeds"></div>
  </div>
  <div class="bar" id="signup">
    <div class="pitch"><b>More cities are coming.</b>Get each new map, and the Python behind it, in my free newsletter.</div>
    <a class="go" id="sub" href="https://milanjanosov.substack.com/subscribe?utm_source=transit-pulse" target="_blank" rel="noopener">Subscribe free</a>
    <button class="x" id="close" aria-label="Hide">✕</button>
  </div>
</div>

<div id="loading" class="hidden">Loading the timetable…</div>


<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
// ------------------------------------------------------------------ config
// Sign-ups go to the Substack subscribe page (utm_source shows up in the
// Substack dashboard). When the page is embedded elsewhere with its own
// signup, ?embed=1 hides this bar.
// Visitor counts: GoatCounter (free, no cookies, so no consent banner).
// Empty => nothing is loaded or sent.
const GOATCOUNTER = "";
function track(name) {
  if (window.goatcounter && goatcounter.count) goatcounter.count({ path: name, title: name, event: true });
}
if (GOATCOUNTER) {
  const g = document.createElement("script");
  g.async = true; g.src = "https://gc.zgo.at/count.js";
  g.dataset.goatcounter = `https://${GOATCOUNTER}.goatcounter.com/count`;
  document.head.appendChild(g);
}
const Q = new URLSearchParams(location.search);
if (Q.get("embed")) document.body.classList.add("embed");

const ESRI = l => `https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_${l}/MapServer/tile/{z}/{y}/{x}`;
const SPEEDS = [[60, "½×"], [120, "1×"], [300, "2.5×"], [900, "7.5×"]];   // timetable seconds per real second; 1× = the reel's pace
const WORLD = { center: [10, 38], zoom: innerWidth < 640 ? 0.6 : 1.6 };
const R = 6378137, TAU = 2 * Math.PI;
const $ = id => document.getElementById(id);

// ------------------------------------------------------------------ data
// One city at a time. Shapes are delta-encoded integer metres in Web
// Mercator; a trip is (start second, pattern, profile, route name).
let D = null, shapes, pats, profs, trips, tripEnd, tripStarts, maxDur, cityKey = null, loadSeq = 0;
const cache = {};

function decode(d) {
  shapes = []; maxDur = 0;
  const [ox, oy] = d.origin;
  for (const flat of d.shapes) {
    const n = flat.length / 2, x = new Float64Array(n), y = new Float64Array(n), cum = new Float64Array(n);
    let ax = ox, ay = oy;
    for (let i = 0; i < n; i++) {
      ax += flat[2 * i]; ay += flat[2 * i + 1]; x[i] = ax; y[i] = ay;
      if (i) cum[i] = cum[i - 1] + Math.hypot(x[i] - x[i - 1], y[i] - y[i - 1]);
    }
    shapes.push({ x, y, cum });
  }
  // cum is rebuilt from metre-rounded vertices, so it drifts from the engine's
  // by well under a metre per vertex - invisible at map scale
  pats = d.patterns.map(([s, c, e, ds]) => ({ s, c, e, ds: Int32Array.from(ds) }));
  profs = d.profiles.map(p => Int32Array.from(p));
  trips = new Int32Array(d.trips);
  const n = trips.length / 4;
  tripEnd = new Int32Array(n); tripStarts = new Int32Array(n);
  for (let i = 0; i < n; i++) {
    const p = profs[trips[4 * i + 2]];
    tripStarts[i] = trips[4 * i];
    tripEnd[i] = trips[4 * i] + p[p.length - 1];
    maxDur = Math.max(maxDur, p[p.length - 1]);
  }
}

function bisect(a, v) {          // last index i with a[i] <= v
  let lo = 0, hi = a.length - 1;
  while (lo < hi) { const m = (lo + hi + 1) >> 1; if (a[m] <= v) lo = m; else hi = m - 1; }
  return lo;
}

// time -> distance along shape -> (x, y): the same two np.interp as the reel
function pos(pat, prof, rel, out) {
  if (rel < 0 || rel > prof[prof.length - 1]) return false;
  const i = bisect(prof, rel);
  let d;
  if (i >= prof.length - 1) d = pat.ds[pat.ds.length - 1];
  else {
    const span = prof[i + 1] - prof[i];
    d = span > 0 ? pat.ds[i] + (pat.ds[i + 1] - pat.ds[i]) * (rel - prof[i]) / span : pat.ds[i];
  }
  const sh = shapes[pat.s], c = sh.cum;
  if (d <= 0) { out[0] = sh.x[0]; out[1] = sh.y[0]; return true; }
  if (d >= c[c.length - 1]) { out[0] = sh.x[c.length - 1]; out[1] = sh.y[c.length - 1]; return true; }
  const j = bisect(c, d), f = (d - c[j]) / ((c[j + 1] - c[j]) || 1);
  out[0] = sh.x[j] + (sh.x[j + 1] - sh.x[j]) * f;
  out[1] = sh.y[j] + (sh.y[j + 1] - sh.y[j]) * f;
  return true;
}

const toLL = (x, y) => [x / R * 360 / TAU, (2 * Math.atan(Math.exp(y / R)) - Math.PI / 2) * 180 / Math.PI];

// ------------------------------------------------------------------ map
const map = new maplibregl.Map({
  container: "map",
  style: {
    version: 8,
    sources: {
      base: { type: "raster", tiles: [ESRI("Base")], tileSize: 256, maxzoom: 16,
        attribution: "Basemap Esri, HERE, Garmin, © OpenStreetMap contributors · Timetables: public GTFS feeds" },
      ref: { type: "raster", tiles: [ESRI("Reference")], tileSize: 256, maxzoom: 16 },
      net: { type: "geojson", data: { type: "FeatureCollection", features: [] } },
    },
    layers: [
      { id: "bg", type: "background", paint: { "background-color": "#0d0d0d" } },
      { id: "base", type: "raster", source: "base", paint: { "raster-brightness-max": 0.45 } },
      { id: "net", type: "line", source: "net", layout: { "line-join": "round", "line-cap": "round" },
        paint: {
          "line-color": ["get", "col"],
          "line-opacity": ["case", ["==", ["get", "e"], 1], 0.45, ["get", "a"]],
          "line-width": ["interpolate", ["linear"], ["zoom"], 10, ["case", ["==", ["get", "e"], 1], 2.2, 0.6],
            14, ["case", ["==", ["get", "e"], 1], 5, 1.6]],
        } },
      { id: "ref", type: "raster", source: "ref", paint: { "raster-opacity": 0.55 } },
    ],
  },
  center: WORLD.center, zoom: WORLD.zoom, minZoom: 0.3, maxZoom: 16, renderWorldCopies: false,
  dragRotate: false, pitchWithRotate: false, touchPitch: false, attributionControl: { compact: true },
});
map.touchZoomRotate.disableRotation();

function setNetwork() {
  const feats = D ? shapes.map((sh, i) => {
    const [c, e] = D.shape_style[i];
    const coords = [];
    for (let k = 0; k < sh.x.length; k++) coords.push(toLL(sh.x[k], sh.y[k]));
    return { type: "Feature", properties: { col: D.colours[c], e, a: D.network_alpha },
      geometry: { type: "LineString", coordinates: coords } };
  }).sort((a, b) => a.properties.e - b.properties.e) : [];   // emphasised lines on top
  map.getSource("net").setData({ type: "FeatureCollection", features: feats });
}

// ------------------------------------------------------------------ city markers
let CITIES = [];
const markers = {};
function addMarkers() {
  for (const c of CITIES) {
    const el = document.createElement("div");
    el.className = "city";
    el.innerHTML = `<span class="pin"></span><span class="lbl">${c.name}</span>`;
    el.title = `${c.name}: ${c.trips.toLocaleString("en")} scheduled trips in a day`;
    el.onclick = ev => { ev.stopPropagation(); openCity(c.key); };
    markers[c.key] = new maplibregl.Marker({ element: el, anchor: "left" }).setLngLat(c.center).addTo(map);
  }
}

// ------------------------------------------------------------------ vehicles
const fx = $("fx"), ctx = fx.getContext("2d");
let dpr = 1, W = 0, H = 0, sprites = [], spriteR = 0;

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  fx.width = W * dpr; fx.height = H * dpr;
  fx.style.width = W + "px"; fx.style.height = H + "px";
}

function dotRadius() {            // px; grows gently with zoom like a map symbol
  return Math.max(1.4, 2.1 * Math.pow(1.45, map.getZoom() - 11.3));
}

// one pre-rendered sprite per (colour, emphasis): glow, disc, white core at 26% of the area
function buildSprites() {
  spriteR = dotRadius();
  sprites = D.colours.map(col => [1, 1.6].map(scale => {
    const r = spriteR * scale * dpr, g = r * 3.2, s = Math.ceil(2 * g), cv = document.createElement("canvas");
    cv.width = cv.height = s;
    const c = cv.getContext("2d"), m = s / 2;
    const glow = c.createRadialGradient(m, m, r * 0.6, m, m, g);
    glow.addColorStop(0, col + "66"); glow.addColorStop(1, col + "00");
    c.fillStyle = glow; c.beginPath(); c.arc(m, m, g, 0, TAU); c.fill();
    c.fillStyle = col; c.beginPath(); c.arc(m, m, r, 0, TAU); c.fill();
    c.fillStyle = "#ffffff"; c.beginPath(); c.arc(m, m, r * Math.sqrt(0.26), 0, TAU); c.fill();
    return { cv, half: m };
  }));
}

const TRAIL = 8;
const tmp = [0, 0];
let simT = 8 * 3600, speed = 120, playing = true, lastFrame = performance.now();

function draw() {
  ctx.clearRect(0, 0, fx.width, fx.height);
  if (!D) return;
  if (Math.abs(dotRadius() - spriteR) > 0.15) buildSprites();
  const k = 512 * Math.pow(2, map.getZoom()) / (TAU * R) * dpr;   // device px per mercator metre
  const cLL = map.getCenter();
  const cx = cLL.lng * TAU / 360 * R;
  const cy = R * Math.log(Math.tan(Math.PI / 4 + cLL.lat * Math.PI / 360));
  const hw = W * dpr / 2, hh = H * dpr / 2;

  const step = speed / 30;                                    // trail spacing = one reel frame of timetable
  const n = tripStarts.length;
  const lo = bisect(tripStarts, simT - maxDur), hi = bisect(tripStarts, simT);
  // trails, batched per colour and per age
  const paths = D.colours.map(() => Array.from({ length: TRAIL }, () => new Path2D()));
  const heads = [];
  let live = 0;
  for (let i = lo; i <= hi && i < n; i++) {
    const st = tripStarts[i];
    if (st > simT || tripEnd[i] < simT) continue;
    const pat = pats[trips[4 * i + 1]], prof = profs[trips[4 * i + 2]];
    if (!pos(pat, prof, simT - st, tmp)) continue;
    live++;
    let px = hw + (tmp[0] - cx) * k, py = hh - (tmp[1] - cy) * k;
    if (px < -40 || py < -40 || px > fx.width + 40 || py > fx.height + 40) continue;
    heads.push(px, py, pat.c, pat.e);
    for (let a = 1; a <= TRAIL; a++) {
      if (!pos(pat, prof, simT - st - a * step, tmp)) break;
      const qx = hw + (tmp[0] - cx) * k, qy = hh - (tmp[1] - cy) * k;
      const p = paths[pat.c][a - 1]; p.moveTo(px, py); p.lineTo(qx, qy);
      px = qx; py = qy;
    }
  }
  ctx.lineCap = "round";
  ctx.lineWidth = spriteR * 1.1 * dpr;
  for (let c = 0; c < paths.length; c++) {
    ctx.strokeStyle = D.colours[c];
    for (let a = 0; a < TRAIL; a++) { ctx.globalAlpha = 0.55 * (1 - a / TRAIL); ctx.stroke(paths[c][a]); }
  }
  ctx.globalAlpha = 1;
  for (let e = 0; e <= 1; e++)                                // emphasised dots drawn last, on top
    for (let h = 0; h < heads.length; h += 4) {
      if (heads[h + 3] !== e) continue;
      const sp = sprites[heads[h + 2]][e];
      ctx.drawImage(sp.cv, heads[h] - sp.half, heads[h + 1] - sp.half);
    }
  $("count").textContent = `${live.toLocaleString("en")} vehicles running`;
}

// ------------------------------------------------------------------ clock + controls
const slider = $("slider"), clockEl = $("clock");
const fmt = t => { const s = ((Math.floor(t) % 86400) + 86400) % 86400;
  return String(Math.floor(s / 3600)).padStart(2, "0") + ":" + String(Math.floor(s / 60) % 60).padStart(2, "0"); };

function tick(now) {
  const dt = Math.min(0.1, (now - lastFrame) / 1000); lastFrame = now;
  if (D) {
    if (playing) {
      simT += dt * speed;
      if (simT > D.t1) simT = D.t0;
      slider.value = Math.round(simT);
    }
    clockEl.textContent = fmt(simT);
  }
  draw();
  requestAnimationFrame(tick);
}

function setPlaying(p) { playing = p; $("play").textContent = p ? "❚❚" : "▶"; }

function setLegend() {
  const rows = (D.legend || []).map(([name, cols]) => [name[0].toUpperCase() + name.slice(1),
    Array.isArray(cols) ? cols : [cols]]);
  $("legend").innerHTML = `<div class="title">Mode</div>` + rows.map(([n, cols]) =>
    `<div class="row"><span class="dots">${cols.slice(0, 6).map(x => `<i style="background:${x};color:${x}"></i>`).join("")}</span>${n}</div>`).join("");
}

function initControls() {
  slider.addEventListener("input", () => { simT = +slider.value; });
  slider.addEventListener("pointerdown", () => setPlaying(false));
  $("play").onclick = () => setPlaying(!playing);
  const box = $("speeds");
  for (const [v, label] of SPEEDS) {
    const b = document.createElement("button"); b.textContent = label; b.className = v === speed ? "on" : "";
    b.onclick = () => { speed = v; [...box.children].forEach(x => x.classList.toggle("on", x === b)); };
    box.appendChild(b);
  }
  addEventListener("keydown", e => { if (e.code === "Space" && e.target.tagName !== "INPUT" && D) { e.preventDefault(); setPlaying(!playing); } });
  $("back").onclick = closeCity;

  // signup
  $("close").onclick = () => $("signup").style.display = "none";
  $("sub").onclick = () => track("subscribe-click");
}

// ------------------------------------------------------------------ search
function initSearch() {
  const q = $("q"), hits = $("hits");
  let list = [], sel = 0;
  const norm = t => t.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
  const render = () => {
    const v = norm(q.value.trim());
    list = v ? CITIES.filter(c => norm(c.name).includes(v)).sort((a, b) => norm(a.name).indexOf(v) - norm(b.name).indexOf(v))
             : [...CITIES].sort((a, b) => a.name.localeCompare(b.name));
    sel = 0;
    hits.innerHTML = list.length ? list.map((c, i) =>
      `<div data-k="${c.key}" class="${i === sel ? "sel" : ""}">${c.name}<span>${c.trips.toLocaleString("en")} trips</span></div>`).join("")
      : `<div>No city yet. <span>Tell us which one!</span></div>`;
    hits.classList.remove("hidden");
  };
  const pick = key => { hits.classList.add("hidden"); q.value = ""; q.blur(); if (key) openCity(key); };
  q.addEventListener("focus", render);
  q.addEventListener("input", render);
  q.addEventListener("keydown", e => {
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault(); sel = (sel + (e.key === "ArrowDown" ? 1 : -1) + list.length) % list.length;
      [...hits.children].forEach((d, i) => d.classList.toggle("sel", i === sel));
    } else if (e.key === "Enter") pick(list[sel] && list[sel].key);
    else if (e.key === "Escape") pick(null);
  });
  hits.addEventListener("mousedown", e => { const d = e.target.closest("[data-k]"); if (d) pick(d.dataset.k); });
  q.addEventListener("blur", () => setTimeout(() => hits.classList.add("hidden"), 150));
}

// ------------------------------------------------------------------ city <-> landing
function setUrl(key) {
  const u = new URL(location.href);
  key ? u.searchParams.set("city", key) : u.searchParams.delete("city");
  history.replaceState(null, "", u);
}

async function openCity(key) {
  const meta = CITIES.find(c => c.key === key);
  if (!meta) return;
  const seq = ++loadSeq;
  const [a, b] = [toLL(meta.bbox[0], meta.bbox[1]), toLL(meta.bbox[2], meta.bbox[3])];
  map.fitBounds([a, b], { padding: 20, duration: 1600 });
  $("loading").classList.toggle("hidden", !!cache[key]);
  const d = cache[key] || (cache[key] = await fetch(`data/${key}.json`).then(r => r.json()));
  if (seq !== loadSeq) return;                                // the user already picked another city
  D = d; cityKey = key; decode(d);
  setNetwork(); buildSprites(); setLegend();
  for (const [k, m] of Object.entries(markers)) m.getElement().classList.toggle("hidden", k === key);
  $("city").textContent = d.city;
  const day = new Date(d.date.slice(0, 4) + "-" + d.date.slice(4, 6) + "-" + d.date.slice(6)).toLocaleDateString("en", { weekday: "long" });
  $("subtitle").textContent = `Every scheduled vehicle · a ${day} timetable`;
  slider.min = d.t0; slider.max = d.t1;
  simT = Math.min(Math.max(simT, d.t0), d.t1);
  for (const id of ["clock", "back", "legend", "player"]) $(id).classList.remove("hidden");
  $("loading").classList.add("hidden");
  setUrl(key);
  track(`city-${key}`);
}

function closeCity() {
  loadSeq++;
  D = null; cityKey = null;
  setNetwork();
  for (const m of Object.values(markers)) m.getElement().classList.remove("hidden");
  $("city").textContent = "Transit Pulse";
  $("subtitle").textContent = "Every scheduled vehicle, through a whole day. Pick a city on the map.";
  $("count").textContent = "";
  for (const id of ["clock", "back", "legend", "player"]) $(id).classList.add("hidden");
  map.flyTo({ ...WORLD, duration: 1400 });
  setUrl(null);
}

// ------------------------------------------------------------------ boot
resize(); addEventListener("resize", resize);
map.on("load", async () => {
  CITIES = await fetch("data/cities.json").then(r => r.json());
  addMarkers(); initControls(); initSearch();
  const far = () => document.body.classList.toggle("far", map.getZoom() < 3.2);
  map.on("zoom", far); far();
  $("count").textContent = `${CITIES.length} cities so far`;
  if (Q.get("city")) openCity(Q.get("city"));
  requestAnimationFrame(tick);
});
</script>
</body>
